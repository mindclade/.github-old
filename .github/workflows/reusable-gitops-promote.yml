---
name: Reusable — GitOps promotion proposal

on:
  workflow_call:
    inputs:
      image-ref:
        required: true
        type: string
      release-id:
        required: true
        type: string
      rollback-digest:
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate immutable promotion input
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          RELEASE_ID: ${{ inputs.release-id }}
          ROLLBACK_DIGEST: ${{ inputs.rollback-digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$ROLLBACK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [ "$GITHUB_EVENT_NAME" = push ] || exit 1
          [ "$GITHUB_REF" = refs/heads/main ] || exit 1
          [ "$GITHUB_REPOSITORY" = mindclade/mindclade-internal-monorepo ] || exit 1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ARC_PROMOTER }}
          service_account: ${{ vars.SA_ARTIFACT_PROMOTER }}
          project_id: ${{ vars.CI_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3
        with:
          version: "580.0.0"

      - id: promoter-key
        name: Read the one authorized promoter App key version
        env:
          PROJECT: ${{ vars.ARC_PROMOTER_SECRET_PROJECT }}
          SECRET: ${{ vars.ARC_PROMOTER_PRIVATE_KEY_SECRET }}
          VERSION: ${{ vars.ARC_PROMOTER_PRIVATE_KEY_VERSION }}
        run: |
          set -euo pipefail
          key="$(gcloud secrets versions access "$VERSION" \
            --project="$PROJECT" --secret="$SECRET")"
          [ -n "$key" ] || { echo "::error::promoter App key is empty"; exit 1; }
          echo "::add-mask::$key"
          {
            echo 'private-key<<MINDCLADE_APP_KEY'
            printf '%s\n' "$key"
            echo 'MINDCLADE_APP_KEY'
          } >> "$GITHUB_OUTPUT"

      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.ARC_PROMOTER_APP_ID }}
          private-key: ${{ steps.promoter-key.outputs.private-key }}
          owner: mindclade
          repositories: gitops

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mindclade/gitops
          ref: main
          path: gitops
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0

      - name: Open a review-only promotion pull request
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_REF: ${{ inputs.image-ref }}
          RELEASE_ID: ${{ inputs.release-id }}
          ROLLBACK_DIGEST: ${{ inputs.rollback-digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="promotion/${RELEASE_ID}-${SOURCE_SHA:0:12}"
          nix develop .#ci --command python3 scripts/create-release-promotion.py \
            --release-id "$RELEASE_ID" \
            --image-ref "$IMAGE_REF" \
            --source-sha "$SOURCE_SHA" \
            --rollback-digest "$ROLLBACK_DIGEST"
          git config user.name 'mindclade-release-promoter[bot]'
          git config user.email 'mindclade-release-promoter[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add deployments
          git commit -m "chore(promotion): propose ${RELEASE_ID}"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(promotion): propose ${RELEASE_ID}" \
            --body "Automated proposal for ${IMAGE_REF}. Source: ${SOURCE_SHA}. No auto-merge."
