---
name: Reusable — Nix qualification

on:
  workflow_call:
    inputs:
      watch-path-regex:
        description: Extended regular expression selecting pull-request changes that require Nix qualification
        required: false
        type: string
        default: "(^|/)(flake\\.nix|flake\\.lock|[^/]+\\.nix)$|^\\.github/workflows/.*nix.*\\.ya?ml$"
      ci-command:
        description: Optional repository validation command executed inside the locked ci development shell
        required: false
        type: string
        default: ''
      enable-aarch64-linux:
        description: Qualify the flake on a native GitHub-hosted Linux arm64 runner
        required: false
        type: boolean
        default: false
      enable-aarch64-darwin:
        description: Qualify the flake on a native GitHub-hosted Apple Silicon runner
        required: false
        type: boolean
        default: false
      reproducibility-targets:
        description: Newline-delimited x86_64-linux installables rebuilt on two independent runners
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should-run: ${{ steps.changes.outputs.should-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select qualification scope
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha }}
          WATCH_PATH_REGEX: ${{ inputs.watch-path-regex }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${DIFF_BASE}" || -z "${DIFF_HEAD}" ]]; then
            echo "Pull-request comparison SHAs are unavailable; qualifying fail-closed."
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          set +e
          printf '' | grep -Eq -- "${WATCH_PATH_REGEX}"
          regex_status=$?
          set -e
          if [[ ${regex_status} -eq 2 ]]; then
            echo "watch-path-regex is not a valid extended regular expression" >&2
            exit 1
          fi

          changed_files="${RUNNER_TEMP}/nix-qualification-changed-files"
          if ! git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" > "${changed_files}"; then
            echo "Unable to compute the pull-request diff; qualifying fail-closed."
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          should_run=false
          while IFS= read -r changed_file; do
            if [[ "${changed_file}" =~ ${WATCH_PATH_REGEX} ]]; then
              should_run=true
              break
            fi
          done < "${changed_files}"
          echo "should-run=${should_run}" >> "${GITHUB_OUTPUT}"

  x86_64_linux:
    name: x86_64-linux
    needs: detect
    if: needs.detect.outputs.should-run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            sandbox = true
      - name: Qualify locked flake natively
        env:
          CI_COMMAND: ${{ inputs.ci-command }}
          EXPECTED_SYSTEM: x86_64-linux
        run: |
          set -euo pipefail
          test -f flake.lock
          actual_system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          test "${actual_system}" = "${EXPECTED_SYSTEM}"
          nix flake metadata --no-write-lock-file
          nix flake check --no-update-lock-file --show-trace
          if [[ -n "${CI_COMMAND}" ]]; then
            nix develop --no-update-lock-file --ignore-environment .#ci \
              --command bash -euo pipefail -c "${CI_COMMAND}"
          fi
      - name: Record native qualification evidence
        env:
          EXPECTED_SYSTEM: x86_64-linux
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/nix-native-evidence"
          mkdir -p "${evidence_dir}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema": "mindclade-nix-native-evidence-v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "system": os.environ["EXPECTED_SYSTEM"],
              "runner_name": os.environ["RUNNER_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "outcome": "success",
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "nix-native-evidence" / "evidence.json"
          target.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: nix-native-x86-64-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nix-native-evidence
          if-no-files-found: error
          retention-days: 30

  aarch64_linux:
    name: aarch64-linux
    needs: detect
    if: needs.detect.outputs.should-run == 'true' && inputs.enable-aarch64-linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            sandbox = true
      - name: Qualify locked flake natively
        env:
          CI_COMMAND: ${{ inputs.ci-command }}
          EXPECTED_SYSTEM: aarch64-linux
        run: |
          set -euo pipefail
          test -f flake.lock
          actual_system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          test "${actual_system}" = "${EXPECTED_SYSTEM}"
          nix flake metadata --no-write-lock-file
          nix flake check --no-update-lock-file --show-trace
          if [[ -n "${CI_COMMAND}" ]]; then
            nix develop --no-update-lock-file --ignore-environment .#ci \
              --command bash -euo pipefail -c "${CI_COMMAND}"
          fi
      - name: Record native qualification evidence
        env:
          EXPECTED_SYSTEM: aarch64-linux
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/nix-native-evidence"
          mkdir -p "${evidence_dir}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema": "mindclade-nix-native-evidence-v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "system": os.environ["EXPECTED_SYSTEM"],
              "runner_name": os.environ["RUNNER_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "outcome": "success",
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "nix-native-evidence" / "evidence.json"
          target.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: nix-native-aarch64-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nix-native-evidence
          if-no-files-found: error
          retention-days: 30

  aarch64_darwin:
    name: aarch64-darwin
    needs: detect
    if: needs.detect.outputs.should-run == 'true' && inputs.enable-aarch64-darwin
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            sandbox = true
      - name: Qualify locked flake natively
        env:
          CI_COMMAND: ${{ inputs.ci-command }}
          EXPECTED_SYSTEM: aarch64-darwin
        run: |
          set -euo pipefail
          test -f flake.lock
          actual_system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          test "${actual_system}" = "${EXPECTED_SYSTEM}"
          nix flake metadata --no-write-lock-file
          nix flake check --no-update-lock-file --show-trace
          if [[ -n "${CI_COMMAND}" ]]; then
            nix develop --no-update-lock-file --ignore-environment .#ci \
              --command bash -euo pipefail -c "${CI_COMMAND}"
          fi
      - name: Record native qualification evidence
        env:
          EXPECTED_SYSTEM: aarch64-darwin
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/nix-native-evidence"
          mkdir -p "${evidence_dir}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema": "mindclade-nix-native-evidence-v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "system": os.environ["EXPECTED_SYSTEM"],
              "runner_name": os.environ["RUNNER_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "outcome": "success",
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "nix-native-evidence" / "evidence.json"
          target.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: nix-native-aarch64-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nix-native-evidence
          if-no-files-found: error
          retention-days: 30

  rebuild_a:
    name: rebuild-a
    needs: detect
    if: needs.detect.outputs.should-run == 'true' && inputs.reproducibility-targets != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            sandbox = true
      - name: Rebuild selected outputs and record evidence
        env:
          REPRODUCIBILITY_TARGETS: ${{ inputs.reproducibility-targets }}
        run: |
          set -euo pipefail
          test -f flake.lock
          evidence_dir="${RUNNER_TEMP}/nix-repro-evidence"
          mkdir -p "${evidence_dir}"
          evidence="${evidence_dir}/evidence.tsv"
          : > "${evidence}"

          while IFS= read -r target; do
            target="${target#"${target%%[![:space:]]*}"}"
            target="${target%"${target##*[![:space:]]}"}"
            [[ -z "${target}" ]] && continue

            mapfile -t outputs < <(
              nix build --no-link --print-out-paths --no-update-lock-file "${target}"
            )
            if [[ ${#outputs[@]} -ne 1 ]]; then
              echo "${target} must resolve to exactly one output path" >&2
              exit 1
            fi
            nix build --no-link --rebuild --no-update-lock-file "${target}"
            output="${outputs[0]}"
            derivation="$(nix path-info --derivation "${output}")"
            output_hash="$(nix hash path --sri "${output}")"
            printf '%s\t%s\t%s\t%s\n' \
              "${target}" "${derivation}" "${output}" "${output_hash}" >> "${evidence}"
          done <<< "${REPRODUCIBILITY_TARGETS}"

          test -s "${evidence}"
          LC_ALL=C sort -o "${evidence}" "${evidence}"
          . /etc/os-release
          test "${ID}" = ubuntu
          test "${VERSION_ID}" = 24.04
          {
            printf 'schema\tnix-reproducibility-evidence-v1\n'
            printf 'commit\t%s\n' "${GITHUB_SHA}"
            printf 'flake-lock\t%s\n' "$(nix hash file --sri flake.lock)"
            printf 'runner-image\t%s-%s\n' "${ID}" "${VERSION_ID}"
          } > "${evidence_dir}/metadata.tsv"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: nix-repro-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nix-repro-evidence
          if-no-files-found: error
          retention-days: 30

  rebuild_b:
    name: rebuild-b
    needs: detect
    if: needs.detect.outputs.should-run == 'true' && inputs.reproducibility-targets != ''
    # A distinct GitHub-hosted image detects undeclared host dependencies rather than merely
    # repeating the same build on an identical runner template.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            sandbox = true
      - name: Rebuild selected outputs and record evidence
        env:
          REPRODUCIBILITY_TARGETS: ${{ inputs.reproducibility-targets }}
        run: |
          set -euo pipefail
          test -f flake.lock
          evidence_dir="${RUNNER_TEMP}/nix-repro-evidence"
          mkdir -p "${evidence_dir}"
          evidence="${evidence_dir}/evidence.tsv"
          : > "${evidence}"

          while IFS= read -r target; do
            target="${target#"${target%%[![:space:]]*}"}"
            target="${target%"${target##*[![:space:]]}"}"
            [[ -z "${target}" ]] && continue

            mapfile -t outputs < <(
              nix build --no-link --print-out-paths --no-update-lock-file "${target}"
            )
            if [[ ${#outputs[@]} -ne 1 ]]; then
              echo "${target} must resolve to exactly one output path" >&2
              exit 1
            fi
            nix build --no-link --rebuild --no-update-lock-file "${target}"
            output="${outputs[0]}"
            derivation="$(nix path-info --derivation "${output}")"
            output_hash="$(nix hash path --sri "${output}")"
            printf '%s\t%s\t%s\t%s\n' \
              "${target}" "${derivation}" "${output}" "${output_hash}" >> "${evidence}"
          done <<< "${REPRODUCIBILITY_TARGETS}"

          test -s "${evidence}"
          LC_ALL=C sort -o "${evidence}" "${evidence}"
          . /etc/os-release
          test "${ID}" = ubuntu
          test "${VERSION_ID}" = 22.04
          {
            printf 'schema\tnix-reproducibility-evidence-v1\n'
            printf 'commit\t%s\n' "${GITHUB_SHA}"
            printf 'flake-lock\t%s\n' "$(nix hash file --sri flake.lock)"
            printf 'runner-image\t%s-%s\n' "${ID}" "${VERSION_ID}"
          } > "${evidence_dir}/metadata.tsv"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: nix-repro-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nix-repro-evidence
          if-no-files-found: error
          retention-days: 30

  compare_rebuilds:
    name: compare-rebuilds
    needs:
      - detect
      - rebuild_a
      - rebuild_b
    if: >-
      always() &&
      needs.detect.outputs.should-run == 'true' &&
      inputs.reproducibility-targets != '' &&
      needs.rebuild_a.result == 'success' &&
      needs.rebuild_b.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: nix-repro-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebuild-a
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: nix-repro-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebuild-b
      - name: Compare independent rebuild evidence
        run: |
          set -euo pipefail
          image_a="$(awk -F '\t' '$1 == "runner-image" {print $2}' \
            "${RUNNER_TEMP}/rebuild-a/metadata.tsv")"
          image_b="$(awk -F '\t' '$1 == "runner-image" {print $2}' \
            "${RUNNER_TEMP}/rebuild-b/metadata.tsv")"
          test "${image_a}" = ubuntu-24.04
          test "${image_b}" = ubuntu-22.04
          test "${image_a}" != "${image_b}"
          grep -v $'^runner-image\t' \
            "${RUNNER_TEMP}/rebuild-a/metadata.tsv" > "${RUNNER_TEMP}/metadata-a-common.tsv"
          grep -v $'^runner-image\t' \
            "${RUNNER_TEMP}/rebuild-b/metadata.tsv" > "${RUNNER_TEMP}/metadata-b-common.tsv"
          diff -u \
            "${RUNNER_TEMP}/metadata-a-common.tsv" \
            "${RUNNER_TEMP}/metadata-b-common.tsv"
          diff -u \
            "${RUNNER_TEMP}/rebuild-a/evidence.tsv" \
            "${RUNNER_TEMP}/rebuild-b/evidence.tsv"
          {
            echo '### Independent Nix rebuilds agree'
            echo
            printf -- '- Runner images: `%s` and `%s`\n\n' "${image_a}" "${image_b}"
            echo '```text'
            cat "${RUNNER_TEMP}/rebuild-a/evidence.tsv"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  verdict:
    name: verdict
    needs:
      - detect
      - x86_64_linux
      - aarch64_linux
      - aarch64_darwin
      - rebuild_a
      - rebuild_b
      - compare_rebuilds
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SHOULD_RUN: ${{ needs.detect.outputs.should-run }}
      DETECT_RESULT: ${{ needs.detect.result }}
      X86_RESULT: ${{ needs.x86_64_linux.result }}
      ENABLE_ARM_LINUX: ${{ inputs.enable-aarch64-linux }}
      ARM_LINUX_RESULT: ${{ needs.aarch64_linux.result }}
      ENABLE_ARM_DARWIN: ${{ inputs.enable-aarch64-darwin }}
      ARM_DARWIN_RESULT: ${{ needs.aarch64_darwin.result }}
      REPRODUCIBILITY_TARGETS: ${{ inputs.reproducibility-targets }}
      REBUILD_A_RESULT: ${{ needs.rebuild_a.result }}
      REBUILD_B_RESULT: ${{ needs.rebuild_b.result }}
      COMPARE_RESULT: ${{ needs.compare_rebuilds.result }}
    steps:
      - name: Enforce qualification result
        run: |
          set -euo pipefail

          test "${DETECT_RESULT}" = "success"
          if [[ "${SHOULD_RUN}" != "true" ]]; then
            echo "No Nix-owned paths changed; qualification is not required."
            exit 0
          fi

          test "${X86_RESULT}" = "success"
          if [[ "${ENABLE_ARM_LINUX}" = "true" ]]; then
            test "${ARM_LINUX_RESULT}" = "success"
          fi
          if [[ "${ENABLE_ARM_DARWIN}" = "true" ]]; then
            test "${ARM_DARWIN_RESULT}" = "success"
          fi
          if [[ -n "${REPRODUCIBILITY_TARGETS}" ]]; then
            test "${REBUILD_A_RESULT}" = "success"
            test "${REBUILD_B_RESULT}" = "success"
            test "${COMPARE_RESULT}" = "success"
          fi
