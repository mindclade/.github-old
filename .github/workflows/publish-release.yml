---
# Publishing is deliberately separate from tag creation and draft assembly. A credential-free
# authorization job and connected governance preflight run before the two protected approvals.
name: Publish workflow release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed annotated full-semver tag whose draft is assembled.
        required: true
        type: string
      qualification-evidence-digest:
        description: SHA-256 digest of the immutable connected qualification bundle.
        required: true
        type: string
      qualification-run-id:
        description: Successful exact-tag Nix qualification workflow run ID.
        required: true
        type: string
      change-ticket:
        description: Approved protected change ticket.
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize protected-main publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Enforce the immutable dispatch boundary
        env:
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_REF_PROTECTED: ${{ github.ref_protected }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_REF: mindclade/.github/.github/workflows/publish-release.yml@refs/heads/main
        run: |
          set -euo pipefail
          test "${ACTUAL_REPOSITORY}" = mindclade/.github
          test "${ACTUAL_EVENT}" = workflow_dispatch
          test "${ACTUAL_REF}" = refs/heads/main
          test "${ACTUAL_REF_PROTECTED}" = true
          test "${ACTUAL_WORKFLOW_REF}" = "${EXPECTED_WORKFLOW_REF}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind checkout to the current protected main head
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_SHA}"
          test "$current_main" = "${EXPECTED_SHA}"
          git diff --quiet --no-ext-diff
          git diff --cached --quiet --no-ext-diff

      - name: Mint read-only release-governance token
        id: governance-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.1
        with:
          app-id: ${{ vars.RELEASE_GOVERNANCE_READER_APP_ID }}
          private-key: ${{ secrets.RELEASE_GOVERNANCE_READER_APP_PRIVATE_KEY }}
          owner: mindclade
          repositories: .github
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-members: read
          permission-metadata: read

      - name: Verify connected release governance
        env:
          GH_TOKEN: ${{ steps.governance-token.outputs.token }}
          EXPECTED_RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 tools/verify_release_governance.py \
            --repository "${GITHUB_REPOSITORY}" \
            --release-team-id "${EXPECTED_RELEASE_TEAM_ID}"

  platform-approval:
    needs: authorize
    name: Platform release approval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: workflow-release-platform
    steps:
      - name: Record platform approval
        run: echo 'Platform approved protected workflow publication.'

  publish:
    needs: platform-approval
    name: Publish qualified immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: workflow-release-security
    concurrency:
      group: workflow-release-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Mint read-only release-governance token
        id: governance-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.1
        with:
          app-id: ${{ vars.RELEASE_GOVERNANCE_READER_APP_ID }}
          private-key: ${{ secrets.RELEASE_GOVERNANCE_READER_APP_PRIVATE_KEY }}
          owner: mindclade
          repositories: .github
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-members: read
          permission-metadata: read

      - name: Revalidate current protected-main publication authority
        env:
          EXPECTED_RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.governance-token.outputs.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_SHA}"
          test "$current_main" = "${EXPECTED_SHA}"
          python3 tools/verify_release_governance.py \
            --repository "${GITHUB_REPOSITORY}" \
            --release-team-id "${EXPECTED_RELEASE_TEAM_ID}"
          git diff --quiet --no-ext-diff
          git diff --cached --quiet --no-ext-diff

      - name: Validate protected publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EVIDENCE_DIGEST: ${{ inputs.qualification-evidence-digest }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification-run-id }}
          CHANGE_TICKET: ${{ inputs.change-ticket }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHANGE_TICKET" =~ ^[A-Z][A-Z0-9]+-[1-9][0-9]*$ ]]
          [ "$EVIDENCE_DIGEST" != "sha256:$(printf '0%.0s' {1..64})" ]
          [ "$(git cat-file -t "$TAG")" = tag ]
          remote_tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            --jq .object.sha)"
          [ "$remote_tag_object" = "$(git rev-parse --verify "${TAG}^{tag}")" ]
          git merge-base --is-ancestor "${TAG}^{}" "${GITHUB_SHA}"
          python3 tools/verify_release_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-source "$(git rev-parse --verify "${TAG}^{commit}")"
          python3 tools/validate-release-spec.py "contracts/releases/${TAG}.json"

      - name: Verify connected exact-tag qualification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EVIDENCE_DIGEST: ${{ inputs.qualification-evidence-digest }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification-run-id }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          source_commit="$(git rev-parse --verify "${TAG}^{}")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}" \
            > "$work/run.json"
          run_attempt="$(jq -r .run_attempt "$work/run.json")"
          completed_at="$(jq -er .updated_at "$work/run.json")"
          completed_epoch="$(date -u -d "$completed_at" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds="$((now_epoch - completed_epoch))"
          [ "$age_seconds" -ge 0 ]
          [ "$age_seconds" -le 86400 ]
          jq -e \
            --arg source "$source_commit" \
            '.event == "workflow_dispatch"
              and .conclusion == "success"
              and .head_sha == $source
              and .path == ".github/workflows/nix-qualification.yml"' \
            "$work/run.json" >/dev/null
          gh run download "$QUALIFICATION_RUN_ID" \
            --name "workflow-release-qualification-${QUALIFICATION_RUN_ID}-${run_attempt}" \
            --dir "$work/evidence"
          (cd "$work/evidence" && sha256sum --check qualification-evidence.json.sha256)
          actual_digest="sha256:$(sha256sum "$work/evidence/qualification-evidence.json" \
            | awk '{print $1}')"
          [ "$actual_digest" = "$EVIDENCE_DIGEST" ]
          jq -e \
            --arg tag "$TAG" \
            --arg source "$source_commit" \
            --argjson run_id "$QUALIFICATION_RUN_ID" \
            --argjson run_attempt "$run_attempt" \
            '.schema_version == 1
              and .tag == $tag
              and .source_commit == $source
              and .workflow_sha == $source
              and .run_id == $run_id
              and .run_attempt == $run_attempt' \
            "$work/evidence/qualification-evidence.json" >/dev/null
          gh release upload "$TAG" \
            "$work/evidence/qualification-evidence.json" \
            "$work/evidence/qualification-evidence.json.sha256" \
            --clobber=false

      - name: Verify assembled draft and source manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh release view "$TAG" --json isDraft,tagName > "$work/release.json"
          jq -e --arg tag "$TAG" '.isDraft == true and .tagName == $tag' \
            "$work/release.json" >/dev/null
          gh release download "$TAG" --dir "$work" \
            --pattern 'attested-release-manifest.json*'
          (cd "$work" && sha256sum --check attested-release-manifest.json.sha256)
          python3 tools/validate-release-spec.py \
            "contracts/releases/${TAG}.json" \
            --verify-attestation "$work/attested-release-manifest.json" \
            --expected-source "$(git rev-parse --verify "${TAG}^{}")"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EVIDENCE_DIGEST: ${{ inputs.qualification-evidence-digest }}
          CHANGE_TICKET: ${{ inputs.change-ticket }}
          EXPECTED_RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
          EXPECTED_SHA: ${{ github.sha }}
          GOVERNANCE_TOKEN: ${{ steps.governance-token.outputs.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification-run-id }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          current_main="$(GH_TOKEN="$GOVERNANCE_TOKEN" gh api \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_SHA}"
          test "$current_main" = "${EXPECTED_SHA}"
          expected_tag_object="$(git rev-parse --verify "${TAG}^{tag}")"
          expected_source="$(git rev-parse --verify "${TAG}^{commit}")"
          remote_tag_object="$(GH_TOKEN="$GOVERNANCE_TOKEN" gh api \
            "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "$remote_tag_object" = "$expected_tag_object"
          python3 tools/verify_release_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-source "$expected_source"
          GH_TOKEN="$GOVERNANCE_TOKEN" python3 tools/verify_release_governance.py \
            --repository "${GITHUB_REPOSITORY}" \
            --release-team-id "${EXPECTED_RELEASE_TEAM_ID}" \
            --run-id "${GITHUB_RUN_ID}" \
            --dispatcher "${GITHUB_ACTOR}"
          completed_at="$(GH_TOKEN="$GOVERNANCE_TOKEN" gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}" \
            --jq .updated_at)"
          completed_epoch="$(date -u -d "$completed_at" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds="$((now_epoch - completed_epoch))"
          [ "$age_seconds" -ge 0 ]
          [ "$age_seconds" -le 86400 ]
          gh release view "$TAG" --json body --jq .body > "$notes"
          printf '\n\nConnected qualification: %s\nProtected change: %s\n' \
            "$EVIDENCE_DIGEST" "$CHANGE_TICKET" >> "$notes"
          gh release edit "$TAG" \
            --notes-file "$notes" \
            --draft=false
          gh release view "$TAG" --json isDraft,isImmutable,isPrerelease,tagName \
            > release-publication.json
          jq -e --arg tag "$TAG" '
            .tagName == $tag
            and .isDraft == false
            and .isPrerelease == false
            and .isImmutable == true
          ' release-publication.json >/dev/null
