---
# Promote one independently qualified immutable image digest into the Binary Authorization
# trust chain. All identity and attestor roots come from github-config-managed variables;
# callers can select only the digest. The release environment and GCP WIF binding must both
# restrict this job to the approved released workflow identity.
name: Reusable — Binary Authorization signing

on:
  workflow_call:
    inputs:
      image-ref:
        description: Full Artifact Registry reference pinned as image@sha256:<64 lowercase hex>.
        required: true
        type: string
    outputs:
      created:
        description: Whether this run created a new deployment attestation.
        value: ${{ jobs.sign.outputs.created }}

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    concurrency:
      group: binauthz-sign-${{ inputs.image-ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      created: ${{ steps.attest.outputs.created }}
    steps:
      - name: Validate immutable image and governed trust inputs
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER_SIGNER }}
          SIGNER_SERVICE_ACCOUNT: ${{ vars.SA_ARTIFACT_SIGNER }}
          BUILD_PROJECT: ${{ vars.BINAUTHZ_BUILD_ATTESTOR_PROJECT }}
          BUILD_ATTESTOR: ${{ vars.BINAUTHZ_BUILD_ATTESTOR }}
          QUALIFICATION_PROJECT: ${{ vars.BINAUTHZ_QUALIFICATION_ATTESTOR_PROJECT }}
          QUALIFICATION_ATTESTOR: ${{ vars.BINAUTHZ_QUALIFICATION_ATTESTOR }}
          DEPLOYMENT_PROJECT: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT }}
          DEPLOYMENT_ATTESTOR: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR }}
          DEPLOYMENT_KEY_VERSION: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR_KEY_VERSION }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_REF" =~ ^[a-z0-9][a-z0-9.-]*-docker\.pkg\.dev/[a-z][a-z0-9-]{4,28}[a-z0-9]/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image-ref must be a digest-pinned Artifact Registry reference" >&2
            exit 1
          fi
          if [[ ! "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]; then
            echo "::error::WIF_PROVIDER_SIGNER is absent or malformed" >&2
            exit 1
          fi
          if [[ ! "$SIGNER_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::SA_ARTIFACT_SIGNER is absent or malformed" >&2
            exit 1
          fi
          for project in "$BUILD_PROJECT" "$QUALIFICATION_PROJECT" "$DEPLOYMENT_PROJECT"; do
            if [[ ! "$project" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
              echo "::error::Binary Authorization project variable is absent or malformed" >&2
              exit 1
            fi
          done
          for attestor in "$BUILD_ATTESTOR" "$QUALIFICATION_ATTESTOR" "$DEPLOYMENT_ATTESTOR"; do
            if [[ ! "$attestor" =~ ^[a-z][a-z0-9-]{0,61}[a-z0-9]$ ]]; then
              echo "::error::Binary Authorization attestor variable is absent or malformed" >&2
              exit 1
            fi
          done
          roots="$(printf '%s\n' \
            "$BUILD_PROJECT/$BUILD_ATTESTOR" \
            "$QUALIFICATION_PROJECT/$QUALIFICATION_ATTESTOR" \
            "$DEPLOYMENT_PROJECT/$DEPLOYMENT_ATTESTOR" | sort -u | wc -l | tr -d ' ')"
          if [ "$roots" -ne 3 ]; then
            echo "::error::build, qualification, and deployment attestors must be distinct" >&2
            exit 1
          fi
          if [[ ! "$DEPLOYMENT_KEY_VERSION" =~ ^projects/[a-z][a-z0-9-]{4,28}[a-z0-9]/locations/[a-z0-9-]+/keyRings/[A-Za-z0-9_-]+/cryptoKeys/[A-Za-z0-9_-]+/cryptoKeyVersions/[1-9][0-9]*$ ]]; then
            echo "::error::BINAUTHZ_DEPLOYMENT_ATTESTOR_KEY_VERSION must name an immutable KMS key version" >&2
            exit 1
          fi
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || {
            echo "::error::the caller must grant permissions: id-token: write" >&2
            exit 1
          }

      - id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_SIGNER }}
          service_account: ${{ vars.SA_ARTIFACT_SIGNER }}
          project_id: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3
        with:
          version: "580.0.0"

      - name: Configure read-only registry access
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REF%%/*}"
          gcloud auth configure-docker "$registry" --quiet

      - id: attest
        name: Validate upstream signatures and create deployment attestation
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          BUILD_PROJECT: ${{ vars.BINAUTHZ_BUILD_ATTESTOR_PROJECT }}
          BUILD_ATTESTOR: ${{ vars.BINAUTHZ_BUILD_ATTESTOR }}
          QUALIFICATION_PROJECT: ${{ vars.BINAUTHZ_QUALIFICATION_ATTESTOR_PROJECT }}
          QUALIFICATION_ATTESTOR: ${{ vars.BINAUTHZ_QUALIFICATION_ATTESTOR }}
          DEPLOYMENT_PROJECT: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT }}
          DEPLOYMENT_ATTESTOR: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR }}
          DEPLOYMENT_KEY_VERSION: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR_KEY_VERSION }}
        run: |
          set -euo pipefail

          access_token="$(gcloud auth print-access-token)"

          # Listing an occurrence proves only that metadata exists. The validation-helper API
          # verifies the occurrence payload and signature against the named attestor's trusted
          # public keys. Accept any one valid occurrence so key rotation remains idempotent.
          validate_attestation() {
            local project="$1" attestor="$2" label="$3" required="$4"
            local occurrences occurrence request_file response_file
            occurrences="$(gcloud container binauthz attestations list \
              --project="$project" \
              --artifact-url="$IMAGE_REF" \
              --attestor="$attestor" \
              --attestor-project="$project" \
              --limit=100 \
              --format=json)"
            request_file="${RUNNER_TEMP}/binauthz-${label}-request.json"
            response_file="${RUNNER_TEMP}/binauthz-${label}-response.json"

            while IFS= read -r occurrence; do
              [ -n "$occurrence" ] || continue
              if ! jq -e \
                '.attestation != null and .noteName != null and .resourceUri != null' \
                <<< "$occurrence" >/dev/null; then
                continue
              fi
              jq -c '{
                attestation: .attestation,
                occurrenceNote: .noteName,
                occurrenceResourceUri: .resourceUri
              }' <<< "$occurrence" > "$request_file"
              if ! curl --silent --show-error --fail \
                --request POST \
                --header "Authorization: Bearer ${access_token}" \
                --header 'Content-Type: application/json' \
                --data-binary "@${request_file}" \
                --output "$response_file" \
                "https://binaryauthorization.googleapis.com/v1/projects/${project}/attestors/${attestor}:validateAttestationOccurrence"; then
                continue
              fi
              if jq -e '.result == "VERIFIED"' "$response_file" >/dev/null; then
                return 0
              fi
            done < <(jq -c '.[]' <<< "$occurrences")

            if [ "$required" = true ]; then
              echo "::error::no cryptographically valid ${label} attestation exists for ${IMAGE_REF}" >&2
            fi
            return 1
          }

          validate_attestation "$BUILD_PROJECT" "$BUILD_ATTESTOR" build-provenance true
          validate_attestation \
            "$QUALIFICATION_PROJECT" "$QUALIFICATION_ATTESTOR" qualification true

          if validate_attestation \
            "$DEPLOYMENT_PROJECT" "$DEPLOYMENT_ATTESTOR" deployment false; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # KMS sign-and-create remains in the beta gcloud track in 580.0.0. The CLI version
          # is pinned above, and --validate verifies the new occurrence against the attestor.
          gcloud beta container binauthz attestations sign-and-create \
            --project="$DEPLOYMENT_PROJECT" \
            --artifact-url="$IMAGE_REF" \
            --attestor="$DEPLOYMENT_ATTESTOR" \
            --attestor-project="$DEPLOYMENT_PROJECT" \
            --keyversion="$DEPLOYMENT_KEY_VERSION" \
            --validate \
            --quiet
          validate_attestation \
            "$DEPLOYMENT_PROJECT" "$DEPLOYMENT_ATTESTOR" deployment true
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          CREATED: ${{ steps.attest.outputs.created }}
        run: |
          {
            echo "### Binary Authorization promotion"
            echo
            echo "- Digest: \`$IMAGE_REF\`"
            echo "- Build/provenance authority: ARC builder attestor"
            echo "- Independent qualification authority: ARC qualifier attestor"
            echo "- New deployment attestation created: \`${CREATED:-false}\`"
            echo "- Protected environment: \`release\`"
          } >> "$GITHUB_STEP_SUMMARY"
