---
# MINDCLADE CONFIDENTIAL - PROPRIETARY AND TRADE SECRET
# Copyright (c) 2026 Mindclade. All rights reserved.
schema_version: 1
repository: .github
repository_class: enterprise-control
visibility: internal
github:
  enterprise_url: https://github.com/enterprises/mindclade
  organization_url: https://github.com/mindclade
  repository_index_url: https://github.com/orgs/mindclade/repositories
  repository_url: https://github.com/mindclade/.github
authority:
  - shared-workflows
  - community-health
  - workflow-contracts
forbidden_authority:
  - cloud-resources
  - github-enterprise-desired-state
  - kubernetes-desired-state
  - application-source
required_paths:
  - AGENTS.md
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - SUPPORT.md
  - CODE_OF_CONDUCT.md
  - GOVERNANCE.md
  - CHANGELOG.md
  - LEGAL.md
  - LICENSE
  - NOTICE
  - .github/PULL_REQUEST_TEMPLATE.md
  - .github/workflows
  - workflow-templates
  - contracts/workflows
  - .github/CODEOWNERS
forbidden_paths:
  - .terraform
  - .terragrunt-cache
default_branch: main
change_model: pull-request
production_controls:
  required_reviews: true
  codeowners: true
  merge_queue: false
  immutable_actions: true
  oidc_only_cloud_authentication: true
