---
name: Reusable — Python (uv) CI

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11.15"
      uv-version:
        required: false
        type: string
        default: "0.9.29"
      working-directory:
        required: false
        type: string
        default: "."
      packages:
        description: >-
          uv sync scope. "--all-packages" for a workspace, or "--package <name>" for one member.
        required: false
        type: string
        default: "--all-packages"
      pytest-args:
        required: false
        type: string
        default: "-q"
      typecheck:
        description: Run pyright. Disable only for packages that have not been annotated yet.
        required: false
        type: boolean
        default: true
      runs-on:
        required: false
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Sync from the lockfile
        # --locked, never --frozen: this fails if uv.lock is stale rather than silently
        # resolving something different from what a developer has locally.
        run: uv sync --locked ${{ inputs.packages }}

      - name: Lint
        run: |
          set -euo pipefail
          uv run --locked ruff check --output-format=github .
          uv run --locked ruff format --check .

      - name: Typecheck
        if: inputs.typecheck
        run: uv run --locked pyright

      - name: Test
        run: uv run --locked ${{ inputs.packages }} python -m pytest ${{ inputs.pytest-args }}
