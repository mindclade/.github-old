---
# Runs against THIS repository only — it is not a reusable workflow.
#
# Cutting a tag is the entire release mechanism here: consumers pin an exact version, and a
# merge to main reaches nobody until a tag exists and each consumer bumps. This workflow does
# the two things that step needs and a human reliably forgets.
#
# It does NOT create or move tags. github-config restricts creation to Release in one ruleset
# and makes existing `v*` identities immutable with no bypass in a separate ruleset. This only
# reacts to a tag that an authorized human already pushed.
name: Assemble workflow release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  draft:
    name: Validate and assemble draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # tag-protection's tag_name_pattern already rejects anything that is not full
          # semver, so this is a second opinion rather than the gate. It exists because the
          # failure mode it catches is silent: a consumer pinned to a tag that cannot be
          # created gets a workflow-not-found error naming nothing useful.
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${TAG}' is not full semver vX.Y.Z. Consumers cannot pin to it."
            exit 1
          fi

          # An annotated tag carries an author and a message; a lightweight one carries
          # neither, and the release notes below would be empty.
          if [ "$(git cat-file -t "${TAG}")" != "tag" ]; then
            echo "::error::'${TAG}' is a lightweight tag. Cut releases with 'git tag -a'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG}^{}" origin/main; then
            echo "::error::'${TAG}' does not point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Require a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A release nobody documented is one every consumer's reviewer has to reverse
          # engineer from a diff across the repository estate.
          if ! grep -qE "^## ${TAG}( |$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## ${TAG}' section. Move Unreleased under the version before tagging."
            exit 1
          fi

      - name: Validate the release specification
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/validate-release-spec.py "contracts/releases/${TAG}.json"

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v tag="## ${TAG}" '
            $0 == tag        { inside = 1; next }
            inside && /^## /  { exit }
            inside            { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo
            echo "Consumers pin an exact tag. This release reaches a repository only when its"
            echo "\`@vX.Y.Z\` is bumped — Renovate opens those pull requests."
          } >> notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # GitHub recommends assembling an immutable release as a draft, then publishing it
          # once all metadata/assets are complete. Publication locks the release and tag when
          # the organization immutable-releases policy is enforced by github-config.
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file notes.md \
            --verify-tag \
            --draft

      - name: Attach exact source manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse --verify "${TAG}^{}")"
          python3 tools/validate-release-spec.py \
            "contracts/releases/${TAG}.json" \
            --attest-source "$source_commit" \
            --output attested-release-manifest.json
          sha256sum attested-release-manifest.json > attested-release-manifest.json.sha256
          gh release upload "${TAG}" \
            attested-release-manifest.json \
            attested-release-manifest.json.sha256 \
            --clobber=false

      - name: Record the protected publication boundary
        run: |
          {
            echo
            echo '### Publication status'
            echo
            echo 'The release remains a draft. Publication requires the protected'
            echo '`Publish workflow release` dispatch, connected exact-tag qualification,'
            echo 'and two independent environment approvals.'
          } >> "$GITHUB_STEP_SUMMARY"
