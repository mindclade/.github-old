---
name: Reusable — ARC OCI qualification

on:
  workflow_call:
    inputs:
      candidate-artifact:
        required: true
        type: string
      image-ref:
        required: true
        type: string
    outputs:
      qualification-artifact:
        description: Artifact containing qualification results for the exact digest.
        value: ${{ jobs.qualify.outputs.qualification-artifact }}

permissions:
  contents: read

jobs:
  qualify:
    runs-on: mindclade-arc-qualify-cpu
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      qualification-artifact: ${{ steps.contract.outputs.qualification-artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

