name: Synchronize policy bundle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: synchronize-policy-bundle
  cancel-in-progress: false

jobs:
  synchronize:
    strategy:
      fail-fast: false
      matrix:
        repository:
          - .github-private
          - bootstrap
          - github-config
          - gitops
          - infrastructure-live
          - mindclade-internal-monorepo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: workflow-release-platform
    steps:
      - name: Reject untrusted source refs
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = mindclade/.github ]
          [ "$GITHUB_REF" = refs/heads/main ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/v5.0.0
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - id: release
        name: Verify the immutable adoption-validator release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v5.0.0
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh api "/repos/mindclade/.github/releases/tags/${TAG}" > "$work/release.json"
          jq -e --arg tag "$TAG" \
            '.tag_name == $tag
              and .draft == false
              and .prerelease == false
              and .immutable == true' \
            "$work/release.json" >/dev/null
          ref="$(gh api "/repos/mindclade/.github/git/ref/tags/${TAG}")"
          tag_object_sha="$(jq -er '.object | select(.type == "tag") | .sha' <<<"$ref")"
          tag_object="$(gh api "/repos/mindclade/.github/git/tags/${tag_object_sha}")"
          release_commit="$(jq -er '.object | select(.type == "commit") | .sha' <<<"$tag_object")"
          [ "$(git -C release-source rev-parse --verify 'HEAD^{commit}')" = "$release_commit" ]
          python3 release-source/tools/verify_release_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-source "$release_commit"
          gh release download "$TAG" --repo mindclade/.github --dir "$work" \
            --pattern 'attested-release-manifest.json*'
          (cd "$work" && sha256sum --check attested-release-manifest.json.sha256)
          python3 release-source/tools/validate-release-spec.py \
            "release-source/contracts/releases/${TAG}.json" \
            --verify-attestation "$work/attested-release-manifest.json" \
            --expected-source "$release_commit"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - id: publication
        name: Verify the signed bundle for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_commit="$(git -C source rev-parse --verify 'HEAD^{commit}')"
          [ "$source_commit" = "$GITHUB_SHA" ]
          version="$(jq -r .version source/contracts/policy-bundle/manifest.json)"
          artifact_name="mindclade-policy-bundle-${version}"
          archive_name="${artifact_name}.tar.gz"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          python3 source/tools/policy_bundle.py \
            --manifest source/contracts/policy-bundle/manifest.json \
            --source-root source verify
          python3 source/tools/policy_bundle.py \
            --manifest source/contracts/policy-bundle/manifest.json \
            --source-root source build --output "$work/expected.tar.gz"

          runs="$work/runs.json"
          gh api --paginate \
            "/repos/mindclade/.github/actions/workflows/publish-policy-bundle.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=100" \
            --slurp > "$runs"
          run_id="$(
            python3 source/tools/select_policy_bundle_run.py \
              --runs "$runs" \
              --source-commit "$source_commit"
          )"
          gh api "/repos/mindclade/.github/actions/runs/${run_id}/artifacts?per_page=100" > "$work/artifacts.json"
          artifact_id="$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | select(length == 1) | .[0].id' "$work/artifacts.json")"
          gh api "/repos/mindclade/.github/actions/artifacts/${artifact_id}/zip" > "$work/artifact.zip"
          unzip -q "$work/artifact.zip" -d "$work/published"
          archive="$(find "$work/published" -type f -name "$archive_name" -print)"
          checksum="$(find "$work/published" -type f -name "${archive_name}.sha256" -print)"
          [ "$(printf '%s\n' "$archive" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 ]
          [ "$(printf '%s\n' "$checksum" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 ]
          (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          cmp "$work/expected.tar.gz" "$archive"
          gh attestation verify "$archive" \
            --repo mindclade/.github \
            --signer-workflow mindclade/.github/.github/workflows/publish-policy-bundle.yml \
            --source-digest "$source_commit" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners >/dev/null
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.POLICY_SYNC_APP_ID }}
          private-key: ${{ secrets.POLICY_SYNC_APP_PRIVATE_KEY }}
          owner: mindclade
          repositories: ${{ matrix.repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mindclade/${{ matrix.repository }}
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - id: synchronize
        name: Synchronize exact declared artifacts
        env:
          REPOSITORY: ${{ matrix.repository }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_TAG: v5.0.0
        run: |
          set -euo pipefail
          python3 source/tools/policy_bundle.py \
            --manifest source/contracts/policy-bundle/manifest.json \
            --source-root source \
            sync --repository "$REPOSITORY" --target-root target --write
          python3 source/tools/policy_adoption.py \
            --manifest source/contracts/policy-bundle/manifest.json \
            --validator source/actions/validate-repository-home/validate.py \
            --release-tag "$RELEASE_TAG" \
            --release-commit "$RELEASE_COMMIT" \
            --output target/contracts/policy-bundle/adoption.json
          version="${{ steps.publication.outputs.version }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git -C target status --porcelain)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update synchronization pull request
        if: steps.synchronize.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ matrix.repository }}
          VERSION: ${{ steps.synchronize.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          POLICY_COMMIT: ${{ steps.publication.outputs.commit }}
        run: |
          set -euo pipefail
          branch="automation/policy-bundle-${VERSION}"
          git -C target config user.name 'mindclade-policy-sync[bot]'
          git -C target config user.email 'mindclade-policy-sync[bot]@users.noreply.github.com'
          git -C target checkout -B "$branch"
          git -C target add --all
          git -C target commit -m "chore(policy): synchronize bundle ${VERSION}"
          git -C target remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/mindclade/${REPOSITORY}.git"
          git -C target push --force-with-lease origin "HEAD:refs/heads/${branch}"
          existing="$(gh pr list --repo "mindclade/${REPOSITORY}" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          cat > "$body_file" <<EOF
          Synchronizes only artifacts declared by signed policy bundle ${VERSION} from protected
          main commit ${POLICY_COMMIT}. The workflow reproduced the archive and verified its
          GitHub/Sigstore attestation; the adoption validator remains anchored to the immutable,
          signed v5.0.0 release. Legal, Security, and Platform approvals remain mandatory under
          the legal-policy-paths ruleset.

          <!-- mindclade-policy-bundle: version=${VERSION}; release=v5.0.0; release_commit=${RELEASE_COMMIT}; status=published -->

          ## Contributor authorization

          - [ ] I am authorized under a current written agreement with Mindclade, LLC. to submit every part of this contribution.
          - [ ] I identified every third-party component, dataset, model, font, media, specification, or generated artifact and preserved its source, license, provenance, and required notices.
          - [ ] I updated \`LICENSE\`, \`NOTICE\`, the SBOM, or other license evidence when the included or distributed material changed.
          EOF
          if [ -z "$existing" ]; then
            gh pr create \
              --repo "mindclade/${REPOSITORY}" \
              --head "$branch" \
              --base main \
              --draft \
              --title "chore(policy): synchronize bundle ${VERSION}" \
              --body-file "$body_file"
          fi
