---
# Read-only connected qualification for the governance required before a workflow release tag.
# This workflow neither creates a tag nor crosses a protected publication environment.
name: Release governance preflight

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify protected release governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce the immutable dispatch boundary
        env:
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_REF_PROTECTED: ${{ github.ref_protected }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_REF: mindclade/.github/.github/workflows/release-governance-preflight.yml@refs/heads/main
        run: |
          set -euo pipefail
          test "${ACTUAL_REPOSITORY}" = mindclade/.github
          test "${ACTUAL_EVENT}" = workflow_dispatch
          test "${ACTUAL_REF}" = refs/heads/main
          test "${ACTUAL_REF_PROTECTED}" = true
          test "${ACTUAL_WORKFLOW_REF}" = "${EXPECTED_WORKFLOW_REF}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind checkout to the current protected main head
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_SHA}"
          test "$current_main" = "${EXPECTED_SHA}"
          git diff --quiet --no-ext-diff
          git diff --cached --quiet --no-ext-diff

      - name: Mint read-only release-governance token
        id: governance-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.1
        with:
          app-id: ${{ vars.RELEASE_GOVERNANCE_READER_APP_ID }}
          private-key: ${{ secrets.RELEASE_GOVERNANCE_READER_APP_PRIVATE_KEY }}
          owner: mindclade
          repositories: .github
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-members: read
          permission-metadata: read

      - name: Verify connected release governance
        env:
          GH_TOKEN: ${{ steps.governance-token.outputs.token }}
          EXPECTED_RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 tools/verify_release_governance.py \
            --repository "${GITHUB_REPOSITORY}" \
            --release-team-id "${EXPECTED_RELEASE_TEAM_ID}"
