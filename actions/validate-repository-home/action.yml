name: Validate Mindclade repository home and common documents
description: Validate repository-home@2 and common-document@1 against the local contract.

inputs:
  adoption-record-path:
    description: Optional workspace-relative v5 policy adoption provenance record.
    required: false
    default: ""
  local-validator-path:
    description: Optional workspace-relative path to a byte-identical offline validator mirror.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Verify policy adoption provenance
      if: inputs.adoption-record-path != ''
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ADOPTION_RECORD_PATH: ${{ inputs.adoption-record-path }}
        LOCAL_VALIDATOR_PATH: ${{ inputs.local-validator-path }}
      run: >-
        python3 "${GITHUB_ACTION_PATH}/verify_adoption.py"
        --workspace "${GITHUB_WORKSPACE}"
        --action-root "${GITHUB_ACTION_PATH}"
        --action-ref "${ACTION_REF}"
        --adoption-record "${ADOPTION_RECORD_PATH}"
        --local-validator "${LOCAL_VALIDATOR_PATH}"

    - name: Validate repository home
      shell: bash
      env:
        LOCAL_VALIDATOR_PATH: ${{ inputs.local-validator-path }}
      run: >-
        python3 "${GITHUB_ACTION_PATH}/validate.py"
        --root "${GITHUB_WORKSPACE}"
        --local-validator-path "${LOCAL_VALIDATOR_PATH}"
