[project]
name = "smoke-fixture"
version = "0.1.0"
description = "Exists so reusable-uv-ci has something real to sync, lint, typecheck and test."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.290"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package directory does not match the project name (smoke-fixture vs src/fixture), so
# hatchling's default file selection fails without this. Found by building the fixture, which
# is the fixture doing its job.
packages = ["src/fixture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
