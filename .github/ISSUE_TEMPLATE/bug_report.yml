---
name: Bug report
description: Report a reproducible defect.
title: "fix: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, customer data, model weights, or restricted biological
        content. If this is a vulnerability, close this and use private disclosure instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched open and closed issues and this is not a duplicate.
          required: true
        - label: >-
            This is a defect, not a vulnerability. Vulnerabilities go to
            security@mindclade.com or a private advisory on the affected repository.
          required: true
  - type: input
    id: component
    attributes:
      label: Owning component or path
      description: Repository-relative path, matched against CODEOWNERS for routing.
      placeholder: services/control_plane
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the smallest reproducible example and a sanitized log excerpt.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      placeholder: Commit SHA, OS, architecture, and relevant toolchain versions
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation attempted
      description: Exact commands run, and whether this reproduces from a clean checkout.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did you see this?
      options:
        - Local development
        - Development
        - Staging
        - Production
        - Customer VPC deployment
        - On-prem or air-gapped
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: >-
            I removed secrets, private data, model weights, and restricted biological
            content from this report.
          required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or stack trace
      description: >-
        Optional. Rendered verbatim so Markdown does not mangle it. Redact identifiers,
        hostnames, and payloads first. A rendered textarea cannot be marked required, which
        is why this one is not.
      render: shell
