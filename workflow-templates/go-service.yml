name: Go service CI

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Mindclade/.github/.github/workflows/reusable-go-ci.yml@v3.0.0
    with:
      go-version: "1.25.12"
      race: true
      coverage-threshold: 70
