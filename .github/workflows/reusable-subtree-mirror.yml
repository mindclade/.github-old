---
# Publish a subtree of the monorepo to a standalone repository.
#
# The mirror is one-way and destructive on the target: history is rewritten from the
# monorepo's, so anything committed directly to the target is lost. Targets must be
# ruleset-protected against direct pushes by everyone except this workflow's App.
name: Reusable — subtree mirror

on:
  workflow_call:
    inputs:
      subtree-path:
        description: Path within this repo to publish, e.g. infra/terraform/modules
        required: true
        type: string
      target-repo:
        description: Destination in owner/name form.
        required: true
        type: string
      target-branch:
        required: false
        type: string
        default: main
      tag:
        description: >-
          Reserved release input. Must remain empty until a protected signer can create and
          GitHub-verify immutable target tags independently of the mirror App.
        required: false
        type: string
        default: ""
      app-id:
        description: GitHub App id with contents:write on the target repo.
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      runs-on:
        required: false
        type: string
        default: ubuntu-24.04
    secrets:
      app-private-key:
        description: >-
          PEM private key for the App. Source it from GCP Secret Manager in the caller
          rather than storing it as a long-lived GitHub secret.
        required: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # subtree split needs real history; a shallow clone silently produces a truncated
          # mirror rather than failing.
          fetch-depth: 0
          persist-credentials: false

      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.target-repo }}

      - name: Verify the subtree exists
        env:
          SUBTREE_PATH: ${{ inputs.subtree-path }}
          TAG: ${{ inputs.tag }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          TARGET_REPO: ${{ inputs.target-repo }}
        run: |
          set -euo pipefail
          if [ ! -d "$SUBTREE_PATH" ] || [[ "$SUBTREE_PATH" = /* ]] \
            || [[ "/$SUBTREE_PATH/" = *"/./"* ]] \
            || [[ "/$SUBTREE_PATH/" = *"/../"* ]] \
            || [[ "/$SUBTREE_PATH/" = *"//"* ]]; then
            echo "::error::subtree-path is absent or not a normalized repository-relative directory"
            exit 1
          fi
          if ! git ls-files -- "$SUBTREE_PATH" | grep -q .; then
            echo "::error::subtree-path has no tracked source files"
            exit 1
          fi
          [[ "$TARGET_REPO" =~ ^mindclade/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::target-repo must be one repository in the mindclade organization"
            exit 1
          }
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          if [ -n "$TAG" ]; then
            [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "::error::tag must be canonical full SemVer vX.Y.Z"
              exit 1
            }
            echo "::error::subtree target tag creation is blocked until a protected GitHub-verified signing authority is qualified"
            exit 1
          fi

      - name: Split and push
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUBTREE_PATH: ${{ inputs.subtree-path }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          TARGET_REPO: ${{ inputs.target-repo }}
        run: |
          set -euo pipefail
          git config user.name  "mindclade-mirror[bot]"
          git config user.email "mindclade-mirror[bot]@users.noreply.github.com"

          branch="mirror-$(date -u +%Y%m%d%H%M%S)"
          git subtree split --prefix="$SUBTREE_PATH" -b "$branch"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — would force-push $branch to ${TARGET_REPO}:${TARGET_BRANCH}"
            git log --oneline -10 "$branch"
            exit 0
          fi

          # Branch rewriting is the declared one-way mirror authority. Tag creation is blocked
          # above until it moves to a separately protected, cryptographically verified signer.
          git push --force "$remote" "$branch:${TARGET_BRANCH}"

      - name: Summary
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          SUBTREE_PATH: ${{ inputs.subtree-path }}
          TAG: ${{ inputs.tag || 'none' }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          TARGET_REPO: ${{ inputs.target-repo }}
        run: |
          {
            echo "### Subtree mirror"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            printf '| Source | `%s` |\n' "$SUBTREE_PATH"
            printf '| Target | `%s:%s` |\n' "$TARGET_REPO" "$TARGET_BRANCH"
            printf '| Tag | `%s` |\n' "$TAG"
            printf '| Dry run | %s |\n' "$DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
